name: Seiten sichern (temporär)
on:
  push:
    branches: [pcs-capture]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q 'curl_cffi>=0.7,<1'
      - name: Seiten abrufen
        run: |
          mkdir -p pages
          while read -r name url; do
            [ -z "$name" ] && continue
            python3 fetch_pcs.py "$url" "pages/$name.img" > "pages/$name.meta.json" || echo "{\"error\": true}" > "pages/$name.meta.json"
            echo "$name $(cat pages/$name.meta.json | head -c 80)"
            sleep 2
          done < urls.txt
          true
      - name: Zurück auf den Branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add pages
          git commit -qm "Seiten 2027 gesichert"
          git push origin HEAD:pcs-capture
