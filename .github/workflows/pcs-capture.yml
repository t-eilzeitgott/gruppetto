name: PCS-Seiten sichern (temporär)
on:
  push:
    paths: ['.github/workflows/pcs-capture.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q -r scripts/sync/requirements.txt
      - name: Seiten abrufen
        run: |
          mkdir -p /tmp/cap
          for p in stage-1 stage-7 stage-10 stage-14 stage-21; do
            python3 scripts/sync/fetch_pcs.py "https://www.procyclingstats.com/race/giro-d-italia/2026/$p" /tmp/cap/giro-d-italia-2026-$p.html
            sleep 2
          done
          gzip -9 /tmp/cap/*.html
          ls -la /tmp/cap
      - name: Auf Branch pcs-capture legen
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan pcs-capture
          git rm -rfq .
          cp /tmp/cap/*.gz .
          git add *.gz
          git commit -qm "PCS-Seiten Giro 2026 (Rohdaten für Fixtures)"
          git push -f origin pcs-capture
