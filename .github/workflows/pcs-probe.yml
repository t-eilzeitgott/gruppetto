name: PCS-Probe (temporär)
on:
  push:
    paths: ['.github/workflows/pcs-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: curl mit Browser-Kopfzeilen
        continue-on-error: true
        run: |
          for u in https://www.procyclingstats.com/race/giro-d-italia/2026/stage-7 https://www.firstcycling.com/race.php?r=13\&y=2026\&e=07 "https://en.wikipedia.org/w/api.php?action=parse&page=2026_Giro_d%27Italia&prop=wikitext&format=json" https://www.giroditalia.it/en/results/ https://www.letour.fr/en/; do
            code=$(curl -s -o /tmp/p.html -w '%{http_code}' -L --max-time 25 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36' -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' -H 'Accept-Language: en-US,en;q=0.9' "$u")
            title=$(grep -o '<title>[^<]*' /tmp/p.html | head -1 | cut -c8-80)
            echo "::notice::curl $code $(wc -c </tmp/p.html)B [$title] $u"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python cloudscraper und curl_cffi
        continue-on-error: true
        run: |
          pip install -q cloudscraper curl_cffi
          python - <<'PY'
          import re
          u = 'https://www.procyclingstats.com/race/giro-d-italia/2026/stage-7'
          def show(tag, r):
              t = re.search(r'<title>([^<]*)', r.text); n = len(re.findall(r'href="rider/', r.text))
              print(f"::notice::{tag} {r.status_code} {len(r.text)}B [{t.group(1)[:60] if t else ''}] rider-links={n}")
          try:
              import cloudscraper
              show('cloudscraper', cloudscraper.create_scraper(browser={'browser': 'chrome', 'platform': 'windows', 'mobile': False}).get(u, timeout=30))
          except Exception as e: print(f"::notice::cloudscraper Fehler {e}")
          for imp in ['chrome', 'safari', 'firefox']:
              try:
                  from curl_cffi import requests as cr
                  show(f'curl_cffi-{imp}', cr.get(u, impersonate=imp, timeout=30))
              except Exception as e: print(f"::notice::curl_cffi-{imp} Fehler {e}")
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright Chromium
        continue-on-error: true
        run: |
          npm i -s --no-save playwright@1 >/dev/null 2>&1 && npx -y playwright install --with-deps chromium >/dev/null 2>&1
          cat > probe.mjs <<'JS'
          import { chromium } from 'playwright';
          for (const headless of [true]) {
            const b = await chromium.launch({ headless, args: ['--disable-blink-features=AutomationControlled'] });
            const ctx = await b.newContext({ userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/141.0.0.0 Safari/537.36', locale: 'en-GB' });
            const p = await ctx.newPage();
            const r = await p.goto('https://www.procyclingstats.com/race/giro-d-italia/2026/stage-7', { waitUntil: 'domcontentloaded', timeout: 45000 });
            let title = await p.title();
            for (let i = 0; i < 12 && /moment|attention/i.test(title); i++) { await p.waitForTimeout(2500); title = await p.title(); }
            const html = await p.content();
            console.log(`::notice::playwright status=${r?.status()} [${title}] ${html.length}B rider-links=${(html.match(/href="rider\//g) || []).length}`);
            await b.close();
          }
          JS
          node probe.mjs
