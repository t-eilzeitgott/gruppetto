name: Keep-alive

# Supabase pausiert Free-Projekte nach einer Woche ohne Zugriffe.
# Dieser Workflow ruft einmal täglich die Datenbank auf.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank anpingen
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Supabase-Variablen fehlen noch – nichts zu tun."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
