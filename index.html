<!doctype html>
<html lang="de" data-theme="dark" data-tour="neutral">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="gruppetto – das Grand-Tour-Tippspiel für Giro, Tour und Vuelta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="gruppetto">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>gruppetto</title>
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var p = localStorage.getItem('gruppetto.theme');
        var dark = p ? p === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        d.dataset.theme = dark ? 'dark' : 'light';
        // zuletzt gesehene Farbe der Rundfahrt, damit der Start nicht umfärbt
        d.dataset.tour = localStorage.getItem('gruppetto.tourTheme') || 'neutral';
        // Startansicht passend zur Seite (siehe <div id="root">): Startseite, andere Seite, Spiel – oder nichts (Anmeldung)
        var h = location.hash.replace(/^#/, '');
        var seite = h.indexOf('/spiel/garage') === 0 ? 'garage' : h.indexOf('/spiel') === 0 ? 'full' : h && h !== '/' ? 'page' : 'home';
        if (/*LIVE*/false && !localStorage.getItem('gruppetto.session')) seite = 'none';
        d.dataset.boot = seite;
      } catch (e) {}
    })();
  </script>
  <!--CSS-->
</head>
<body>
  <div id="root"><!--BOOT--></div>
  <!-- App-Intro: aus „g." (wie das App-Symbol) rollt der Punkt das Wort aus; danach fliegt die Wortmarke in den Kopf der Startseite. Nur angemeldet. -->
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro__bg"></div>
    <div class="intro__mark"><span class="intro__word">gruppetto</span><span class="intro__roll"><span class="intro__cover"></span><span class="intro__dot"><span class="intro__dotin">.</span><span class="intro__ping"></span></span></span></div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('intro');
      var d = document.documentElement;
      // nicht angemeldet (Anmeldeseite), Browser ohne Web Animations oder automatische Prüfung: kein Intro
      var off = d.dataset.boot === 'none' || /[?&]demo=login\b/.test(location.search);
      try { off = off || localStorage.getItem('gruppetto.nointro') === '1'; } catch (e) {}
      if (!el || off || !el.animate) { if (el) el.remove(); return; }
      var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      var q = function (s) { return el.querySelector(s); };
      var mark = q('.intro__mark'), word = q('.intro__word'), roll = q('.intro__roll'), cover = q('.intro__cover');
      var dot = q('.intro__dot'), dotin = q('.intro__dotin'), ping = q('.intro__ping'), bg = q('.intro__bg');
      var t0 = performance.now();
      var SEQ = calm ? 250 : 1150;
      // Animationen der Sequenz (ohne den Endlos-Ring) – beim Abschluss werden sie beschleunigt statt abgebrochen
      var seq = [];
      // Ring genau um den Punkt (Tinte des „."-Zeichens aus der Schrift vermessen)
      try {
        var cs = getComputedStyle(mark);
        var cx = document.createElement('canvas').getContext('2d');
        cx.font = cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
        var m = cx.measureText('.');
        var fs = parseFloat(cs.fontSize);
        var base = (fs - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
        var rr = Math.max(m.actualBoundingBoxRight + m.actualBoundingBoxLeft, m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) / 2;
        var pcx = (m.actualBoundingBoxRight - m.actualBoundingBoxLeft) / 2;
        var pcy = base - (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
        if (rr > 0 && isFinite(pcy)) {
          ping.style.left = (pcx - rr) + 'px'; ping.style.top = (pcy - rr) + 'px'; ping.style.bottom = 'auto';
          ping.style.width = ping.style.height = (2 * rr) + 'px';
          dotin.style.transformOrigin = pcx + 'px ' + (base + m.actualBoundingBoxDescent) + 'px';
        }
      } catch (e) {}
      if (!calm) {
        // Maße: Breite des „g" und des ganzen Worts
        var r = document.createRange();
        r.setStart(word.firstChild, 0); r.setEnd(word.firstChild, 1);
        var gW = r.getBoundingClientRect().width;
        var hidden = word.getBoundingClientRect().width - gW;
        var shift = hidden / 2;
        var roll1 = 'cubic-bezier(.6,0,.3,1)';
        // 1) „g." erscheint mittig (wie das App-Symbol), 2) rückt mit dem ausgerollten Wort in die Mitte
        var A = function (n, k, o) { var x = n.animate(k, o); seq.push(x); return x; };
        A(mark, [
          { offset: 0, opacity: 0, transform: 'translateX(' + shift + 'px) scale(.84)', easing: 'cubic-bezier(.2,.9,.3,1.12)' },
          { offset: 0.3, opacity: 1, transform: 'translateX(' + shift + 'px) scale(1)', easing: roll1 },
          { offset: 1, opacity: 1, transform: 'translateX(0) scale(1)' }
        ], { duration: 950, fill: 'both' });
        // 2) der Punkt rollt nach rechts, dahinter erscheint das Wort (Abdeckung wandert mit)
        var move = [{ transform: 'translateX(' + (-hidden) + 'px)' }, { transform: 'translateX(0)' }];
        A(roll, move, { duration: 650, delay: 300, easing: roll1, fill: 'both' });
        A(cover, [{ opacity: 1 }, { opacity: 0 }], { duration: 120, delay: 950, fill: 'both' });
        // kleine Hüpfer beim Rollen, dann ein weiches Aufsetzen
        A(dot, [
          { transform: 'translateY(0)' }, { transform: 'translateY(-.13em)' }, { transform: 'translateY(0)' },
          { transform: 'translateY(-.08em)' }, { transform: 'translateY(0)' }, { transform: 'translateY(-.035em)' }, { transform: 'translateY(0)' }
        ], { duration: 650, delay: 300, easing: 'ease-in-out', fill: 'both' });
        A(dotin, [
          { transform: 'scale(1)' }, { transform: 'scale(1.32,.72)' }, { transform: 'scale(.9,1.14)' }, { transform: 'scale(1)' }
        ], { duration: 420, delay: 930, easing: 'ease-out', fill: 'both' });
        // ein leiser Ring um den Punkt, solange die App noch lädt
        // (startet mit der Sequenz-Uhr, sobald der Punkt aufgesetzt hat – siehe unten)
        var startPing = function () {
          ping.animate([{ opacity: 0.55, transform: 'scale(.4)' }, { opacity: 0, transform: 'scale(2.6)' }], { duration: 1100, iterations: Infinity, easing: 'cubic-bezier(.2,.6,.3,1)' });
        };
      }
      // Kasten nur um die Buchstaben (Textknoten), ohne Abdeckung und Ring
      var textBox = function (root) {
        var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), n, box = null;
        while ((n = w.nextNode())) {
          if (!n.nodeValue.trim()) continue;
          var r = document.createRange();
          r.selectNodeContents(n);
          var c = r.getBoundingClientRect();
          if (!c.width) continue;
          box = box ? { left: Math.min(box.left, c.left), top: Math.min(box.top, c.top), right: Math.max(box.right, c.right), bottom: Math.max(box.bottom, c.bottom) }
            : { left: c.left, top: c.top, right: c.right, bottom: c.bottom };
        }
        if (box) { box.width = box.right - box.left; box.height = box.bottom - box.top; }
        return box;
      };
      // Eigene Uhr für die Sequenz: läuft nur mit gezeichneten Bildern weiter (höchstens 2 Bilder pro Schritt).
      // Ist der Browser beim App-Start kurz beschäftigt (iOS zeichnet dann nichts), pausiert das Intro, statt
      // anschließend ans Ende zu springen.
      var END = 0, clock = 0, rate = 1, last = null, waiters = [], pinged = false;
      seq.forEach(function (x) { x.pause(); x.currentTime = 0; END = Math.max(END, x.effect.getComputedTiming().endTime); });
      var settle = function () {
        var w = waiters; waiters = [];
        w.forEach(function (f) { f(); });
      };
      var step = function (ts) {
        var dt = last == null ? 0 : Math.min(ts - last, 34);
        last = ts;
        clock = Math.min(END, clock + dt * rate);
        seq.forEach(function (x) { x.currentTime = clock; });
        if (!pinged && clock >= 950 && startPing) { pinged = true; if (!done) startPing(); }
        if (clock < END) requestAnimationFrame(step); else settle();
      };
      if (seq.length) requestAnimationFrame(step);
      // Sequenz zu Ende spielen: was noch fehlt, läuft in höchstens MAXREST ms (schneller, aber vollständig)
      var MAXREST = 420;
      var playOut = function (then) {
        var rest = (END - clock) / rate;
        if (!seq.length || rest <= 0) { then(); return; }
        if (rest > MAXREST) rate = (END - clock) / MAXREST;
        var fired = false;
        var go = function () { if (!fired) { fired = true; then(); } };
        waiters.push(go);
        // Notbremse, falls gar keine Bilder mehr kommen (z. B. App im Hintergrund)
        setTimeout(function () { if (!fired) { clock = END; seq.forEach(function (x) { x.currentTime = END; }); go(); } }, 2500);
      };
      var done = false;
      // Abschluss: Wortmarke fliegt an ihren Platz im Kopf der App (target), der Hintergrund blendet aus
      var finish = function (target) {
        if (done) return;
        done = true;
        var wait = function (fn) { if (calm) setTimeout(fn, Math.max(0, t0 + SEQ - performance.now())); else playOut(fn); };
        wait(function () {
          el.style.pointerEvents = 'none';
          var a = textBox(mark);
          var b = target && !calm ? textBox(target) : null;
          if (a && b) {
            // skalieren um die Mitte der Schrift (nicht um die Mitte des Kastens)
            var e = mark.getBoundingClientRect();
            mark.style.transformOrigin = (a.left + a.width / 2 - e.left) + 'px ' + (a.top + a.height / 2 - e.top) + 'px';
            var s = b.width / a.width;
            var dx = b.left + b.width / 2 - (a.left + a.width / 2);
            var dy = b.top + b.height / 2 - (a.top + a.height / 2);
            // solange sie fliegt, ist die echte Wortmarke unsichtbar (sonst stünde sie doppelt da)
            d.classList.add('intro-fly');
            var fly = mark.animate([{ transform: 'translate(0,0) scale(1)' }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')' }],
              { duration: 520, easing: 'cubic-bezier(.4,0,.1,1)', fill: 'forwards' });
            ping.getAnimations().forEach(function (x) { x.cancel(); });
            bg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, delay: 60, easing: 'ease', fill: 'forwards' });
            // gelandet: im selben Bild die echte Wortmarke zeigen und das Intro entfernen
            var land = function () { d.classList.remove('intro-fly'); el.remove(); };
            fly.onfinish = land;
            setTimeout(land, 900);
          } else {
            mark.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.96)' }], { duration: 260, easing: 'ease', fill: 'forwards' });
            bg.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, easing: 'ease', fill: 'forwards' }).onfinish = function () { el.remove(); };
          }
        });
      };
      window.__intro = { finish: finish };
      // falls die App nicht Bescheid gibt: spätestens nach 3,5 s
      setTimeout(function () { finish(null); }, 3500);
    })();
  </script>
  <noscript>gruppetto braucht JavaScript.</noscript>
  <!--JS-->
</body>
</html>
