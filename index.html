<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="gruppetto – das Grand-Tour-Tippspiel für Giro, Tour und Vuelta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="gruppetto">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <!-- App-Symbol fürs iPhone: mit Größe und Versionsmarke (ein früher fehlgeschlagener Abruf bleibt sonst im Speicher
       von Safari hängen – dann setzt iOS ein „G“ als Platzhalter); zusätzlich im Hauptverzeichnis, dort sucht iOS als Letztes -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
  <title>gruppetto</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="gruppetto – das Tippspiel für Giro, Tour und Vuelta">
  <meta property="og:description" content="Tipp mit Freunden auf jede Etappe der Grand Tours. News, Profile, Wertungen und Minispiele für zwischendurch – alles in einer App.">
  <meta property="og:url" content="https://gruppetto.talfahrt.dev/">
  <meta property="og:image" content="https://gruppetto.talfahrt.dev/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="de_DE">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    (function () {
      var d = document.documentElement;
      try {
        var p = localStorage.getItem('gruppetto.theme');
        var dark = p ? p === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        d.dataset.theme = dark ? 'dark' : 'light';
        // zuletzt gesehene Farbe der Rundfahrt, damit der Start nicht umfärbt
        d.dataset.tour = localStorage.getItem('gruppetto.tourTheme') || 'neutral';
        // Startansicht passend zur Seite (siehe <div id="root">): Startseite, andere Seite, Spiel – oder nichts (Anmeldung)
        var h = location.hash.replace(/^#/, '');
        var seite = h.indexOf('/spiel/garage') === 0 ? 'garage' : h.indexOf('/spiel') === 0 ? 'full' : h && h !== '/' ? 'page' : 'home';
        if (/*LIVE*/false && !localStorage.getItem('gruppetto.session')) seite = 'none';
        d.dataset.boot = seite;
        // Spielkarte der Startseite: zuletzt gewähltes Spiel und Höhe der Spiele (bei gleicher Breite), damit sie beim Laden nicht springt
        var g = localStorage.getItem('gruppetto.games.sel');
        if (g) d.dataset.game = g;
        var ah = /^(\d+):(\d+(?:\.\d+)?)$/.exec(localStorage.getItem('gruppetto.games.h') || '');
        if (ah && +ah[1] === window.innerWidth) d.style.setProperty('--arena-h', ah[2] + 'px');
      } catch (e) {}
    })();
  </script>
  <!--CSS-->
</head>
<body>
  <div id="root"><!--BOOT--></div>
  <!-- App-Intro: aus „g." (wie das App-Symbol) rollt der Punkt das Wort aus; danach fliegt die Wortmarke in den Kopf der Startseite. Nur angemeldet. -->
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro__bg"></div>
    <div class="intro__ver"><a class="by" href="https://talfahrt.dev" target="_blank" rel="noopener"><svg class="by__mark" viewBox="0 0 64 64" aria-hidden="true"><path d="M20 14v24c0 7 3.5 10.5 10 10.5M11.5 24.5h17" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M38.5 13 51.5 50" fill="none" stroke="#d7f24b" stroke-width="6" stroke-linecap="round"/></svg><span>talfahrt</span></a><span class="intro__v"><!--VERSION--></span></div>
    <div class="intro__mark"><span class="intro__word">gruppetto</span><span class="intro__roll"><span class="intro__cover"></span><span class="intro__dot"><span class="intro__dotin">.</span><span class="intro__ping"></span></span></span></div>
  </div>
