<!doctype html>
<html lang="de" data-theme="dark" data-tour="neutral">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="gruppetto – das Grand-Tour-Tippspiel für Giro, Tour und Vuelta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="gruppetto">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>gruppetto</title>
  <script>
    (function () {
      try {
        var p = localStorage.getItem('gruppetto.theme');
        var dark = p ? p === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <!--CSS-->
</head>
<body>
  <div id="root"></div>
  <noscript>gruppetto braucht JavaScript.</noscript>
  <!--JS-->
</body>
</html>
